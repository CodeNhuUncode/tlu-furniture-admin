<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLU Furniture - Tất cả sản phẩm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/layout.css">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/products.css">
</head>
<body>

    <load src="./src/includes/header.html" />

    <div class="breadcrumb-wrapper">
        <div class="container breadcrumb">
            <a href="/index.html">Trang chủ</a>
            <span class="separator">/</span>
            <span class="current">Tất cả sản phẩm TLU</span>
        </div>
    </div>

    <section class="page-global-banner" style="width: 100%; height: 350px; background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1616046229478-9901c5536a45?w=1280'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center;">
        <div>
            <h2 style="font-size: 42px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px;">TLU COLLECTION</h2>
            <p style="font-size: 15px; font-weight: 500; background: #333; display: inline-block; padding: 6px 20px; border-radius: 4px;">Tinh hoa nội thất gỗ tràm và vải bọc nhập khẩu</p>
        </div>
    </section>

    <main class="main-content container" style="padding: 40px 15px; min-height: 600px;">
        
        <div class="page-header">
            <h1 class="page-title">Tất cả sản phẩm TLU</h1>
            <div class="sort-box">
                <select>
                    <option>Sản phẩm nổi bật</option>
                    <option>Giá: Tăng dần</option>
                    <option>Giá: Giảm dần</option>
                    <option>Tên: A-Z</option>
                </select>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-label">
                <i class="fas fa-filter"></i> BỘ LỌC
            </div>
            <div class="filter-options">
                <select><option>DANH MỤC</option></select>
                <select><option>GIÁ SẢN PHẨM</option></select>
                <select><option>MÀU SẮC</option></select>
                <select><option>KÍCH THƯỚC</option></select>
            </div>
        </div>

        <div class="product-grid"></div>

        <div class="pagination">
            <a href="#" class="page-num active">1</a>
            <a href="#" class="page-num">2</a>
            <a href="#" class="page-num">3</a>
            <span class="page-dots">...</span>
            <a href="#" class="page-num">10</a>
            <a href="#" class="page-next"><i class="fas fa-arrow-right"></i></a>
        </div>

    </main>

    <load src="./src/includes/policies.html" />
    <load src="./src/includes/footer.html" />

    <script type="module" src="./src/js/detail.js"></script>
</body>
</html>
