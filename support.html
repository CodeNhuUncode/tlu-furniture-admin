<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ gửi khiếu nại - TLU Furniture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/layout.css">
    <link rel="stylesheet" href="./src/css/home.css">

    <style>
        .support-page-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 15px 80px;
            font-family: 'Inter', sans-serif;
        }
        .support-title-box {
            text-align: center;
            margin-bottom: 50px;
        }
        .support-title-box h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
        }
        .support-title-box .line {
            width: 50px;
            height: 2px;
            background: #111;
            margin: 0 auto;
        }
        
        /* Cấu trúc Form điền thông tin */
        .support-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-row-2col {
            display: flex;
            gap: 20px;
        }
        .form-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-item label {
            font-size: 14px;
            font-weight: 700;
            color: #111;
        }
        .form-item input[type="text"],
        .form-item textarea {
            width: 100%;
            border: 1px solid #767676;
            padding: 12px 15px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #333;
            box-sizing: border-box;
            outline: none;
            border-radius: 3px;
            background-color: #fff;
        }
        .form-item input::placeholder,
        .form-item textarea::placeholder {
            color: #aaa;
        }
        .form-item textarea {
            height: 140px;
            resize: none;
        }

        /* Khu vực kéo thả tải ảnh sản phẩm lỗi */
        .upload-drag-zone {
            border: 1px solid #767676;
            border-radius: 4px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .upload-drag-zone:hover {
            background: #fcfcfcfc;
        }
        .upload-drag-zone i {
            font-size: 42px;
            color: #444;
        }
        .upload-drag-zone p {
            font-size: 14px;
            font-weight: 700;
            color: #111;
            margin: 0;
            line-height: 1.5;
        }

        /* Nút gửi đơn khiếu nại màu cam chuẩn */
        .submit-support-btn {
            width: 100%;
            background-color: #ff8a5c; /* Màu cam chuẩn 100% theo ảnh mẫu */
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            transition: background 0.2s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .submit-support-btn:hover {
            background-color: #e57b52;
        }

        /* Khối 4 cam kết hậu mãi chân trang */
        .support-features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 80px;
            border-top: 1px solid #eee;
            padding-top: 40px;
        }
        .feature-box {
            text-align: center;
        }
        .feature-box i {
            font-size: 32px;
            color: #333;
            margin-bottom: 15px;
        }
        .feature-box h4 {
            font-size: 14px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }
        .feature-box p {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <load src="./src/includes/header.html" />

    <div class="breadcrumb-wrapper" style="background: #fff; padding: 15px 0; border-bottom: 1px solid #eee;">
        <div class="container breadcrumb" style="font-size: 13px; color: #666; padding: 0 15px;">
            <a href="/index.html" style="color: #666; text-decoration: none;">Trang chủ</a>
            <span class="separator" style="margin: 0 8px;">/</span>
            <span class="current" style="color: #111; font-weight: 500;">Hỗ trợ gửi khiếu nại</span>
        </div>
    </div>

    <main class="support-page-wrapper">
        
        <div class="support-title-box">
            <h1>Hỗ trợ gửi khiếu nại</h1>
            <div class="line"></div>
        </div>

        <form class="support-form" id="tlu-support-form" onsubmit="event.preventDefault();">
            
            <div class="form-row-2col">
                <div class="form-item">
                    <label>Họ và tên</label>
                    <input type="text" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="form-item">
                    <label>Số điện thoại</label>
                    <input type="text" placeholder="Nhập số điện thoại..." required>
                </div>
            </div>

            <div class="form-item">
                <label>Mã đơn hàng</label>
                <input type="text" placeholder="Ví dụ: MH12345" required>
            </div>

            <div class="form-item">
                <label>Chi tiết lỗi</label>
                <textarea placeholder="Nhập nội dung lỗi..."></textarea>
            </div>

            <div class="form-item">
                <input type="file" id="file-upload-input" accept="image/*" style="display: none;">
                <div class="upload-drag-zone" onclick="document.getElementById('file-upload-input').click()">
                    <i class="fas fa-upload"></i>
                    <p>Kéo thả hoặc bấm vào đây để tải hình<br>ảnh sản phẩm lỗi</p>
                </div>
            </div>

            <button type="submit" class="submit-support-btn">Gửi khiếu nại</button>

        </form>

        <load src="./src/includes/policies.html" />

    <load src="./src/includes/footer.html" />

    <script type="module" src="./src/js/detail.js"></script>
</body>
</html>
